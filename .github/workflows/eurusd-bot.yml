name: EURUSD Scalp Bot

on:
  schedule:
    # Matin : 2 horaires UTC pour couvrir l'heure d'été ET d'hiver (le script s'arrête tout seul si ce n'est pas le bon)
    - cron: "50 5 * * 1-5"
    - cron: "50 6 * * 1-5"
    # Relais de l'après-midi (même principe)
    - cron: "45 10 * * 1-5"
    - cron: "45 11 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "test = message test | backtest | report = bilan cumulatif du journal | live (jusqu'à 18h)"
        type: choice
        default: test
        options: [test, backtest, report, live]
      handoff:
        description: "(automatique) reprise silencieuse après un relais"
        type: boolean
        default: false

# Un seul bot à la fois : le relais attend la fin du créneau du matin
concurrency:
  group: eurusd-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: write   # nécessaire pour que le bot enregistre son journal dans le dépôt
      actions: write    # nécessaire pour que le bot relance tout seul la suite de la journée
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lancer le bot
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CAPITAL: ${{ vars.CAPITAL || '1000' }}
          RISK_PCT: ${{ vars.RISK_PCT || '1' }}
          MAX_HOLD_MIN: ${{ vars.MAX_HOLD_MIN || '45' }}
          READ_EVERY_MIN: ${{ vars.READ_EVERY_MIN || '60' }}
          MODE: ${{ github.event.inputs.mode || 'live' }}
          HANDOFF: ${{ github.event.inputs.handoff }}
          SCHED: ${{ github.event.schedule }}
        run: |
          if [ "$MODE" = "backtest" ]; then python bot.py --backtest
          elif [ "$MODE" = "test" ]; then python bot.py --test-discord
          elif [ "$MODE" = "report" ]; then python bot.py --report
          elif [ "$SCHED" = "50 5 * * 1-5" ] || [ "$SCHED" = "50 6 * * 1-5" ]; then python bot.py --slot morning
          elif [ -n "$SCHED" ]; then python bot.py --slot relay
          else
            EXTRA=""
            if [ "$HANDOFF" = "true" ]; then EXTRA="--handoff"; fi
            python bot.py --until 18:00 --minutes 340 $EXTRA
          fi
      - name: Sauvegarder le journal dans le dépôt
        if: always()
        run: |
          if [ -d journal ] && [ -n "$(git status --porcelain journal)" ]; then
            git config user.name "eurusd-bot"
            git config user.email "eurusd-bot@users.noreply.github.com"
            git add journal
            git commit -m "Journal du bot $(date -u '+%F %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          fi
      - name: Relais automatique (si la journée n'est pas finie)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f .relay_needed ]; then
            gh workflow run "${{ github.workflow }}" -f mode=live -f handoff=true
          fi
